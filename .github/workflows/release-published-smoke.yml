name: Published release smoke
on:
  release: { types: [published] }
permissions: { contents: read, issues: write }
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Verify stable metadata
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", TAG: "${{ github.event.release.tag_name }}" }
        run: |
          gh release view "$TAG" --json isDraft,isPrerelease,assets > release.json
          mkdir assets
          gh release download "$TAG" --dir assets
          node scripts/release/verify-published-release.mjs --release-json release.json --assets-dir assets --repo "$GITHUB_REPOSITORY" --tag "$TAG"
