[package]
name = "cursor-usage-viewer"
version = "0.1.0"
description = "A local, user-triggered Cursor usage viewer"
authors = ["Cursor Usage Viewer contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cursor_usage_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
base64 = "0.23.1"
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tauri = { version = "2.8.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
thiserror = "2.0.16"
url = "2.5.7"
zeroize = { version = "1.8.1", features = ["derive"] }

[dev-dependencies]
minisign-verify = "0.2.5"
tempfile = "3.21.0"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.4"
